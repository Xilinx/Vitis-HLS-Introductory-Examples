part=xck26-sfvc784-2LV-c

[hls]
# Base clock period.  The 2x clock is derived from it in bb/dp_mac4.json.
clock=4ns
syn.top=dp_top
syn.file=src/dp_top.cpp
tb.file=tb/dp_tb.cpp
syn.cflags=-Isrc
tb.cflags=-Isrc
# dp_mac4 is an RTL black box.  The JSON adds the 2x clock domain; HLS names the
# top-level port ap_clk_mult1_div2.  Paths are relative to the directory the
# flow runs from.
syn.blackbox.file=bb/dp_mac4.json
csim.O=true
csim.clean=true
cosim.trace_level=all