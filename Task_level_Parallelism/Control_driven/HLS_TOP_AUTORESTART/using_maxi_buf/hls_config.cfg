part=virtex7

[hls]
syn.top=my_dut::top
clock=4
syn.file=test.cpp
tb.file=test_tb.cpp
tb.cflags=-std=c++14 -Wno-unknown-pragmas
# Waveform capture.  trace_level=all writes every port and internal
# signal to my_dut/hls/sim/verilog/my_dut_top.wdb.
# wave_debug is left OFF here -- it force-opens the Vivado GUI, and
# this design issues 8192 AXI reads per iteration x 8 iterations, so
# the GUI run is slow.  ./run.sh --gui switches it on.
cosim.rtl=verilog
cosim.tool=xsim
cosim.trace_level=all
cosim.wave_debug=false